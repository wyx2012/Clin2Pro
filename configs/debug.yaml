seed: 2026
device: auto
num_workers: 0
output_dir: outputs/debug

data:
  # Data are supplied separately under data/.
  # The loader also checks its parent directory for the five data folders.
  root: "./data"
  id_column: "Participant ID"
  stage1_imputation: "LabTOP"
  stage2_imputations: ["LabTOP", "MICE", "SVD", "MedianMode"]
  stage3_imputations: ["LabTOP"]
  exclude_longitudinal_participants_from_stage1: true
  max_stage1_rows: 512
  max_stage2_pairs_per_imputation: 256

model:
  clinical_hidden: 64
  clinical_layers: 2
  clinical_heads: 4
  clinical_dropout: 0.10
  temporal_hidden: 96
  temporal_dropout: 0.15
  bridge_rank: 8

stage1:
  epochs: 2
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  patience: 2
  loss: huber

stage2:
  epochs: 2
  batch_size: 64
  learning_rate: 0.0005
  encoder_learning_rate: 0.0001
  weight_decay: 0.0001
  val_fraction: 0.15
  patience: 2
  lambda_affinity: 1.0
  lambda_binary: 0.5
  lambda_pathway: 0.3

stage3:
  folds: 2
  validation_fraction: 0.20
  epochs: 2
  batch_size: 32
  learning_rate: 0.0005
  encoder_learning_rate: 0.00005
  weight_decay: 0.0001
  patience: 2
  freeze_clinical_epochs: 1
  lambda_protein: 1.0
  lambda_pathway: 0.3
  lambda_bridge: 0.2
  lambda_regularization: 0.0001
  bridge_l1: 0.0
  top_k_drugs: 20
  train_final_model: true
